<html>

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, monospace;
            background: #0f172a;
            color: #e2e8f0;
        }

        h1 {
            margin: 0 0 12px 0;
            font-size: 20px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .status {
            border: 1px solid #334155;
            background: #111827;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
        }

        #lifecycleLog {
            border: 1px solid #334155;
            background: #020617;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 72px;
            max-height: 180px;
            overflow-y: auto;
        }

        .section {
            margin-bottom: 14px;
        }

        .section h2 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #93c5fd;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            border: 1px solid #475569;
            border-radius: 8px;
            background: #1e293b;
            color: #e2e8f0;
            padding: 10px 8px;
            font-size: 13px;
            text-align: left;
        }

        #lastResult {
            border: 1px solid #334155;
            background: #020617;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 12px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>
<h1>JsBridge Web Demo</h1>

<div class="status-grid">
    <div id="readyState" class="status">ready: pending</div>
    <div id="sessionState" class="status">session: -</div>
    <div id="lifecycleState" class="status">lifecycle: unknown</div>
</div>

<div class="section">
    <h2>Lifecycle Log</h2>
    <div id="lifecycleLog">lifecycleLog: -</div>
</div>

<div class="section">
    <h2>User / Session</h2>
    <div class="actions">
        <button id="getUserSuccess">Get user (exists)</button>
        <button id="getUserFail">Get user (not found)</button>
        <button id="getUserBadSession">Get user (bad session)</button>
        <button id="showNativeLoading">Show native loading</button>
        <button id="getLocationCoarse">Get location (coarse)</button>
        <button id="getLocationFine">Get location (fine)</button>
    </div>
</div>

<div class="section">
    <h2>Platform Plugins</h2>
    <div class="actions">
        <button id="pickImage">Pick image</button>
        <button id="pickInput">Pick input</button>
    </div>
</div>

<div class="section">
    <h2>Timer Stream</h2>
    <div class="actions">
        <button id="timerStart">Timer start (keep stream)</button>
        <button id="timerStop">Timer stop</button>
    </div>
        <div id="timerStreamLog" style="
            margin-top: 8px;
            border: 1px solid #334155;
            background: #020617;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 40px;
            max-height: 160px;
            overflow-y: auto;
        ">stream: -</div>
</div>

<div class="section">
    <h2>Request Extension</h2>
    <div class="actions">
        <button id="requestSuccess">Request success</button>
        <button id="requestFail">Request fail</button>
    </div>
</div>

<div class="section">
    <h2>Protocol Features</h2>
    <div class="actions">
        <button id="requestTimeout" disabled>Request timeout (3s)</button>
        <button id="callUnauthorized" disabled>Call unauthorized method</button>
    </div>
</div>

<div id="lastResult">lastResult: -</div>

<ul id="console"></ul>
<script src="./vconsole.min.js"></script>
<script src="./jsbridge-sdk.js"></script>
<script src="./api/biz-api.js"></script>
<script src="./page/demo-page.js"></script>
<script src="./entry.js"></script>
<script>
    var vConsole = new VConsole();
</script>
</body>

</html>
